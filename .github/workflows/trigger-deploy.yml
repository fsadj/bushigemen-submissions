name: Trigger blog deploy
on:
  push:
    branches: [main]   # PR 合并 = push 到 main
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: 触发博客部署（拉取新投稿并发布）
        run: |
          curl -s -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            https://api.github.com/repos/fsadj/bushigemen-blog/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
          echo "✓ triggered bushigemen-blog deploy"
